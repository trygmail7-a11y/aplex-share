name: Build Release AAB and APK

on:
  push:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project (unzips AplexShare.zip if it is in the repo)
        id: loc
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -n 1)
          if [ -n "$ZIP" ]; then
            mkdir -p "$RUNNER_TEMP/proj"
            unzip -q "$ZIP" -d "$RUNNER_TEMP/proj"
            ROOT=$(dirname "$(find "$RUNNER_TEMP/proj" -name settings.gradle.kts | head -n 1)")
          else
            ROOT=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)")
          fi
          if [ ! -f "$ROOT/settings.gradle.kts" ]; then
            echo "Project not found. Upload AplexShare.zip to the repo root."
            exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          if [ -f "$ROOT/gradle-version.txt" ]; then GV=$(tr -d ' \r\n' < "$ROOT/gradle-version.txt"); else GV=8.13; fi
          echo "gv=$GV" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.loc.outputs.gv }}

      - name: Prepare signing (cleans secrets, alias is fixed to "upload")
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          P1: ${{ secrets.KEYSTORE_PASSWORD }}
          P2: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -n "$KS" ] || { echo "Secret KEYSTORE_BASE64 is missing"; exit 1; }
          [ -n "$P1" ] || { echo "Secret KEYSTORE_PASSWORD is missing"; exit 1; }
          [ -n "$P2" ] || { echo "Secret KEY_PASSWORD is missing"; exit 1; }
          printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
          PW1=$(printf '%s' "$P1" | tr -d ' \r\n')
          PW2=$(printf '%s' "$P2" | tr -d ' \r\n')
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PW1" 2>/dev/null | grep -q "^upload,"; then
            echo "Keystore did not open with alias 'upload'. Check KEYSTORE_BASE64 (one single line) and KEYSTORE_PASSWORD."
            exit 1
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PW1" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$PW2" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=upload" >> "$GITHUB_ENV"

      - name: Build signed release (AAB + APK)
        working-directory: ${{ steps.loc.outputs.root }}
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: AplexShare-release
          if-no-files-found: error
          path: |
            ${{ steps.loc.outputs.root }}/app/build/outputs/bundle/release/*.aab
            ${{ steps.loc.outputs.root }}/app/build/outputs/apk/release/*.apk
            ${{ steps.loc.outputs.root }}/app/build/outputs/mapping/release/mapping.txt
