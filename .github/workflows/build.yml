name: Build APK from ZIP

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project (unzips AplexShare.zip if it is in the repo)
        id: loc
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Found zip: $ZIP"
            mkdir -p "$RUNNER_TEMP/proj"
            unzip -q "$ZIP" -d "$RUNNER_TEMP/proj"
            ROOT=$(dirname "$(find "$RUNNER_TEMP/proj" -name settings.gradle.kts | head -n 1)")
          else
            ROOT=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)")
          fi
          if [ ! -f "$ROOT/settings.gradle.kts" ]; then
            echo "Project not found. Upload AplexShare.zip to the repo root."
            exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.root }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AplexShare-debug-apk
          path: ${{ steps.loc.outputs.root }}/app/build/outputs/apk/debug/*.apk

      - name: Publish APK to Releases (easy download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.loc.outputs.root }}"/app/build/outputs/apk/debug/*.apk AplexShare.apk
          gh release create "build-${{ github.run_number }}" AplexShare.apk \
            --title "Aplex Share build ${{ github.run_number }}" \
            --notes "Debug APK built automatically."
